name: DuoFolio
options:
  bundleIdPrefix: com.kinet
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: M92UKS6NA2
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DuoFolio:
    type: application
    platform: iOS
    sources:
      - path: DuoFolio
      - path: Resources
    info:
      path: DuoFolio/Info.plist
      properties:
        CFBundleDisplayName: DuoFolio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Book
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: Electronic Publication
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [epub]
        CFBundleURLTypes:
          - CFBundleURLName: com.kinet.duofolio
            CFBundleURLSchemes: [duofolio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinet.duofolio
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
